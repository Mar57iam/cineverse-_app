@if (items().length > 0) {
  <section class="media-section" [id]="sectionId()" [attr.aria-labelledby]="'heading-' + sectionId()">
    <header class="section-heading">
      <div>
        <p class="section-eyebrow">{{ eyebrow() }}</p>
        <h2 class="section-title" [id]="'heading-' + sectionId()">{{ title() }}</h2>
      </div>
      @if (hasMoreItems()) {
        <div class="slider-controls" [attr.aria-label]="title() + ' controls'">
          <button type="button" class="slider-arrow" [attr.aria-label]="'Scroll ' + title() + ' left'" (click)="scroll(-1)">
            <svg lucideArrowLeft class="size-4"></svg>
          </button>
          <button type="button" class="slider-arrow" [attr.aria-label]="'Scroll ' + title() + ' right'" (click)="scroll(1)">
            <svg lucideArrowRight class="size-4"></svg>
          </button>
        </div>
      }
    </header>

    <div #slider class="media-carousel" [attr.aria-label]="title() + ' titles'" tabindex="0">
      @for (movie of items(); track movie.mediaType + ':' + movie.id) {
        <app-movie-card
          [movie]="movie"
          [saved]="savedMovieIds().includes(movie.mediaType + ':' + movie.id)"
          [rank]="$index + 1"
          (watchlistToggled)="toggleSaved($event)"
        />
      }
    </div>
  </section>
}
